plugins { id 'com.android.application' }
android {
    namespace 'za.co.phishguard.watch'
    compileSdk 35
    defaultConfig {
        applicationId 'za.co.phishguard.watch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-demo'
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' }
